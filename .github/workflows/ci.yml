name: Reservia CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit & Concurrency Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    env:
      MONGOMS_VERSION: 7.0.14
      MONGOMS_PREFER_GLOBAL_PATH: 0
      MONGOMS_DOWNLOAD_DIR: /tmp/mongo-memory-server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache MongoDB Binary
        uses: actions/cache@v4
        with:
          path: /tmp/mongo-memory-server
          key: mongodb-binaries-7.0.14-${{ runner.os }}

      - name: Install Dependencies
        run: npm ci

      - name: Run Jest Test Suite & Concurrency Tests
        run: npm test

      - name: Run Standalone Concurrency Stress Test
        run: npm run stress-test
